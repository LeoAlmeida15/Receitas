# Sobe apenas o PostgreSQL para desenvolvimento: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: receitas
      POSTGRES_PASSWORD: receitas
      POSTGRES_DB: receitas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
