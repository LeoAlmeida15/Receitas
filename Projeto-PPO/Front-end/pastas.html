<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastas | Receitas Fáceis e Econômicas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <a class="logo" href="index.html">Receitas <span>Fáceis</span></a>
  <nav>
    <a href="index.html">Início</a><a href="receitas.html">Receitas</a>
    <a href="categorias.html">Categorias</a><a href="contato.html">Contato</a>
    <a href="login.html" id="loginLink">Entrar</a>
    <button class="link-button hidden" id="logoutBtn">Sair</button>
  </nav>
</header>
<main class="container page">
  <div id="listaView">
    <p class="eyebrow">Organize suas receitas</p><h1>Pastas</h1>
    <form id="pastaForm" class="filters" style="grid-template-columns:1fr auto">
      <input id="pastaNome" maxlength="60" placeholder="Nome da nova pasta (ex.: Jantares)" required>
      <button class="btn" type="submit">Criar pasta</button>
    </form>
    <p id="pastaStatus" class="status"></p>
    <div id="pastas" class="category-grid"></div>
  </div>

  <div id="detalheView" class="hidden">
    <p><a href="pastas.html">← Todas as pastas</a></p>
    <div class="section-heading">
      <div><p class="eyebrow">Pasta</p><h1 id="pastaTitulo"></h1></div>
      <div class="actions">
        <button class="btn secondary" id="renomear">Renomear</button>
        <button class="btn secondary" id="excluirPasta">Excluir pasta</button>
      </div>
    </div>
    <div id="pastaReceitas" class="recipe-grid"></div>
  </div>
</main>
<footer>Receitas Fáceis e Econômicas © 2026</footer>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pastas.js"></script>
</body>
</html>
